services:
  # 1. Backend Web Service (Node.js + WebSockets + PostgreSQL)
  - type: web
    name: medconnect-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend Static Site (React + Vite SPA)
  - type: web
    name: medconnect-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medconnect-backend
          property: host
          transform: https://{host}/api
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: medconnect-backend
          property: host
          transform: https://{host}
